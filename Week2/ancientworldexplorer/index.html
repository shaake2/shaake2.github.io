<!DOCTYPE html>
<html>
    <head>
        <title>Ancient World Explorer</title>
    </head>

    <body style="background-color: #192b35; color: #f1db9b; font-family: monospace; text-align: center;">

        <h1>ANCIENT WORLD EXPLORER</h1>

        <p>Choose a destination and begin your expedition!</p>

         <img src="./assets/ancient-world.png" alt="Ancient world landscape" style="width: 100%;">

        <h2>Select Destination</h2>

        <section class="destinations">
            <div>
                <button id="egypt">Egypt</button>
                <button id="greece">Greece</button>
            </div>

            <div style="margin-top: 10px;">
                <button id="rome">Rome</button>
                <button id="mesoamerica">Mesoamerica</button>
            </div>
        </section>

        <h2>Exploration Actions</h2>

        <section class="actions">
            <button id="explore">Explore</button>
            <button id="inventory">Inventory</button>
        </section>

        <section id="credits">
            <h2>Credits</h2>
            <p>Image: <a href="https://www.historicalconquest.com/single-post/lessons-plans-from-the-ancient-egypt-the-old-kingdom-c-2686-2181-bc">Historical Conquest</a></p>
        </section>

    </body>
</html>
